const fmt = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const today = () => fmt(new Date());
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const getMonday = (dateStr) => {
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return fmt(d);
};
const getSunday = (dateStr) => {
  const mon = new Date(getMonday(dateStr));
  mon.setDate(mon.getDate() + 6);
  return fmt(mon);
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return fmt(d);
};
const isWeekend = (dateStr) => {
  const d = new Date(dateStr);
  const day = d.getDay();
  return day === 0 || day === 6;
};
const isHoliday = (dateStr) => !!HOLIDAYS[dateStr];
const getWeekRange = (mondayStr) => {
  const sun = getSunday(mondayStr);
  const m = new Date(mondayStr);
  const s = new Date(sun);
  return `${m.getMonth()+1}.${m.getDate()}～${s.getMonth()+1}.${s.getDate()}`;
};
// 自定义起止日期的范围标签
const getCustomRange = (startStr, endStr) => {
  const s = new Date(startStr);
  const e = new Date(endStr);
  return `${s.getMonth()+1}.${s.getDate()}～${e.getMonth()+1}.${e.getDate()}`;
};
const formatDate = (dateStr) => {
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
};

function useStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : (typeof init === 'function' ? init() : init);
    } catch { return typeof init === 'function' ? init() : init; }
  });
  const save = useCallback((v) => {
    setVal(v);
    localStorage.setItem(key, JSON.stringify(v));
  }, [key]);
  return [val, save];
}

// ─────────────────────────────────────────
// AI 调用
// ─────────────────────────────────────────
async function callAI(settings, prompt) {
  const providerId = settings.llm.default;
  const providers = settings.llm.providers || DEFAULT_PROVIDERS;
  const cfg = providers.find(p => p.id === providerId);
  if (!cfg) throw new Error(`未找到 provider "${providerId}"，请检查设置`);
  if (!cfg.apiKey) throw new Error(`请先在设置中为「${cfg.label || cfg.id}」配置 API Key`);

  if (cfg.apiType === 'claude') {
    const baseUrl = (cfg.baseUrl || 'https://api.anthropic.com/v1').replace(/\/$/, '');
    const res = await fetch(`${baseUrl}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': cfg.apiKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: cfg.model, max_tokens: 2048, messages: [{ role: 'user', content: prompt }] }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || res.statusText); }
    const data = await res.json();
    return data.content[0].text;
  } else {
    const baseUrl = (cfg.baseUrl || 'https://api.openai.com/v1').replace(/\/$/, '');
    const res = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.apiKey}` },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: prompt }], max_tokens: 2048 }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || res.statusText); }
    const data = await res.json();
    return data.choices[0].message.content;
  }
}

// ─────────────────────────────────────────
// 周报生成（无AI模板版）
// ─────────────────────────────────────────
function generateReportFromRecords(weekStart, records, weekEnd) {
  weekEnd = weekEnd || getSunday(weekStart);
  const range = getCustomRange(weekStart, weekEnd);

  // 按项目分组，同时统计工时
  const byProject = {};
  records.forEach(r => {
    if (!byProject[r.project]) byProject[r.project] = { recs: [], hours: 0 };
    byProject[r.project].recs.push(r);
    byProject[r.project].hours += r.hours || 0;
  });

  const items = Object.entries(byProject).map(([project, { recs }]) => ({
    id: uid(),
    project,
    content: recs.map(r => r.content).join('；'),
    progress: '开发中',
    note: '',
  }));

  const hoursByProject = {};
  Object.entries(byProject).forEach(([p, { hours }]) => { hoursByProject[p] = hours; });

  const nextItems = items.map(it => ({
    id: uid(),
    project: it.project,
    content: '',
  }));

  let md = `您好：\n\n本周(${range})的工作总结具体如下，请查收。\n\n`;
  md += buildMarkdownTable(items, hoursByProject);
  md += `\n## 下周工作计划\n\n`;
  md += `| 项目 | 工作内容 |\n|------|----------|\n`;
  nextItems.forEach(it => {
    md += `| ${it.project} | ${it.content} |\n`;
  });

  return { items, nextItems, markdown: md, weekStart, weekEnd, range };
}

// 生成本周工作内容 Markdown 表格（含工时列）
function buildMarkdownTable(items, hoursByProject) {
  let md = `## 本周工作内容\n\n`;
  md += `| 项目 | 工时 | 工作内容 | 项目进度 | 备注 |\n|------|------|----------|----------|------|\n`;
  items.forEach(it => {
    const h = hoursByProject && hoursByProject[it.project] != null ? `${hoursByProject[it.project]}h` : '';
    md += `| ${it.project} | ${h} | ${it.content||''} | ${it.progress||''} | ${it.note||''} |\n`;
  });
  return md;
}

function parseMarkdownToReport(md) {
  const items = [];
  const nextItems = [];
  const lines = md.split('\n');
  let section = '';
  let hasHoursCol = false;
  for (const line of lines) {
    if (line.includes('本周工作内容')) { section = 'current'; continue; }
    if (line.includes('下周工作计划')) { section = 'next'; continue; }
    // 检测本周工作内容表头，判断是否有工时列
    if (section === 'current' && line.startsWith('|') && line.includes('项目')) {
      hasHoursCol = line.includes('工时');
      continue;
    }
    if (section === 'current' && line.startsWith('|') && !line.includes('---')) {
      const cols = line.split('|').map(s => s.trim()).filter(Boolean);
      if (cols.length >= 2) {
        if (hasHoursCol) {
          // 新格式：项目 | 工时 | 工作内容 | 项目进度 | 备注
          items.push({ id: uid(), project: cols[0]||'', content: cols[2]||'', progress: cols[3]||'开发中', note: cols[4]||'' });
        } else {
          // 旧格式：项目 | 工作内容 | 项目进度 | 备注
          items.push({ id: uid(), project: cols[0]||'', content: cols[1]||'', progress: cols[2]||'开发中', note: cols[3]||'' });
        }
      }
    }
    if (section === 'next' && line.startsWith('|') && !line.includes('---') && !line.includes('项目')) {
      const cols = line.split('|').map(s => s.trim()).filter(Boolean);
      if (cols.length >= 2) {
        nextItems.push({ id: uid(), project: cols[0]||'', content: cols[1]||'' });
      }
    }
  }
  return { items, nextItems };
}

function buildMarkdown(report, hoursByProject) {
  const range = report.range || getWeekRange(report.weekStart);
  let md = `您好：\n\n本周(${range})的工作总结具体如下，请查收。\n\n`;
  md += buildMarkdownTable(report.items || [], hoursByProject || {});
  md += `\n## 下周工作计划\n\n`;
  md += `| 项目 | 工作内容 |\n|------|----------|\n`;
  (report.nextItems||[]).forEach(it => {
    md += `| ${it.project} | ${it.content||''} |\n`;
  });
  return md;
}

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => window.innerWidth < 768);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return isMobile;
}

// ─────────────────────────────────────────
// Markdown 简易渲染（仅支持应用内格式子集）
// ─────────────────────────────────────────
function renderMarkdown(md) {
  if (!md) return '';
  // 转义 HTML
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = md.split('\n');
  const out = [];
  let inTable = false;
  let headerDone = false;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = esc(raw).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    if (line.startsWith('## ')) {
      if (inTable) { out.push('</table>'); inTable = false; headerDone = false; }
      out.push(`<h2>${line.slice(3)}</h2>`);
    } else if (/^\|/.test(line)) {
      if (!inTable) { out.push('<table>'); inTable = true; headerDone = false; }
      if (/^\|[\s\-|]+$/.test(line)) { headerDone = true; continue; }
      const cols = line.split('|').map(s => s.trim()).filter(Boolean);
      const tag = headerDone ? 'td' : 'th';
      out.push(`<tr>${cols.map(c => `<${tag}>${c}</${tag}>`).join('')}</tr>`);
      if (!headerDone) headerDone = true;
    } else {
      if (inTable) { out.push('</table>'); inTable = false; headerDone = false; }
      if (line.trim()) out.push(`<p>${line}</p>`);
      else out.push('<br>');
    }
  }
  if (inTable) out.push('</table>');
  return out.join('');
}

// ─────────────────────────────────────────
// Modal 组件
// ─────────────────────────────────────────
function Modal({ title, onClose, children, width = 'max-w-lg' }) {
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [onClose]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay" style={{background:'rgba(0,0,0,0.4)'}}>
      <div className={`bg-white rounded-xl shadow-2xl w-full mx-4 ${width} fade-in`} style={{maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h3 className="font-semibold text-gray-800 text-lg">{title}</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <div className="overflow-y-auto flex-1 p-6">{children}</div>
      </div>
    </div>
  );
}

// 工作记录表单
// ─────────────────────────────────────────
function WorkRecordForm({ record, date, projects, onSave, onClose }) {
  const [form, setForm] = useState({
    project: record?.project || '',
    content: record?.content || '',
    hours: record?.hours || 1,
  });
  const [customProject, setCustomProject] = useState('');
  const [showProjects, setShowProjects] = useState(false);
  const projRef = useRef(null);

  const filtered = projects.filter(p => p.toLowerCase().includes((form.project||'').toLowerCase())).slice(0, 8);

  const handleSave = () => {
    if (!form.project.trim()) { alert('请填写项目名称'); return; }
    if (!form.content.trim()) { alert('请填写工作内容'); return; }
    if (!form.hours || form.hours < 0.5 || form.hours > 24) { alert('工时请填写0.5~24之间的数字'); return; }
    onSave({ ...form, hours: parseFloat(form.hours) });
  };

  return (
    <div className="space-y-4">
      <div className="text-sm text-gray-500 font-medium">日期：{formatDate(date)}</div>

      {/* 项目 */}
      <div className="relative" ref={projRef}>
        <label className="block text-sm font-medium text-gray-700 mb-1">项目 <span className="text-red-400">*</span></label>
        <input
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          placeholder="输入或选择项目名称"
          value={form.project}
          onChange={e => { setForm({...form, project: e.target.value}); setShowProjects(true); }}
          onFocus={() => setShowProjects(true)}
          onBlur={() => setTimeout(() => setShowProjects(false), 150)}
        />
        {showProjects && filtered.length > 0 && (
          <div className="absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 overflow-hidden">
            {filtered.map(p => (
              <div key={p} className="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50" onMouseDown={() => { setForm({...form, project: p}); setShowProjects(false); }}>{p}</div>
            ))}
          </div>
        )}
      </div>

      {/* 工作内容 */}
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">工作内容 <span className="text-red-400">*</span></label>
        <textarea
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          rows={3}
          placeholder="描述今天完成的工作..."
          value={form.content}
          onChange={e => setForm({...form, content: e.target.value})}
        />
      </div>

      {/* 工时 */}
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">工时（小时）</label>
        <input
          type="number" min="0.5" max="24" step="0.5"
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          value={form.hours}
          onChange={e => setForm({...form, hours: e.target.value})}
        />
      </div>

      <div className="flex justify-end gap-2 pt-2">
        <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
        <button onClick={handleSave} className="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">保存</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// 日历组件
// ─────────────────────────────────────────
function CalendarView({ workRecords, selectedDate, onSelectDate }) {
  const [viewDate, setViewDate] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });

  const { year, month } = viewDate;
  const todayStr = today();

  // 当月工时统计
  const hoursByDate = useMemo(() => {
    const map = {};
    workRecords.forEach(r => {
      if (!map[r.date]) map[r.date] = 0;
      map[r.date] += r.hours;
    });
    return map;
  }, [workRecords]);

  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1; // Mon start

  const prevMonth = () => {
    if (month === 0) setViewDate({ year: year - 1, month: 11 });
    else setViewDate({ year, month: month - 1 });
  };
  const nextMonth = () => {
    if (month === 11) setViewDate({ year: year + 1, month: 0 });
    else setViewDate({ year, month: month + 1 });
  };
  const goToday = () => {
    const d = new Date();
    setViewDate({ year: d.getFullYear(), month: d.getMonth() });
    onSelectDate(todayStr);
  };

  const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const WEEKDAYS = ['一','二','三','四','五','六','日'];

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push(dateStr);
  }
  while (cells.length % 7 !== 0) cells.push(null);

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
      {/* 头部 */}
      <div className="flex items-center justify-between mb-4">
        <button onClick={prevMonth} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500">&#8249;</button>
        <div className="flex items-center gap-3">
          <span className="font-semibold text-gray-800">{year}年 {MONTHS[month]}</span>
          <button onClick={goToday} className="text-xs text-blue-600 hover:text-blue-700 px-2 py-0.5 border border-blue-200 rounded-full">今天</button>
        </div>
        <button onClick={nextMonth} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500">&#8250;</button>
      </div>

      {/* 星期头 */}
      <div className="grid grid-cols-7 mb-1">
        {WEEKDAYS.map(w => (
          <div key={w} className="text-center text-xs text-gray-400 font-medium py-1">{w}</div>
        ))}
      </div>

      {/* 日期格子 */}
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map((dateStr, idx) => {
          if (!dateStr) return <div key={`e-${idx}`} />;
          const isToday = dateStr === todayStr;
          const isSelected = dateStr === selectedDate;
          const holiday = HOLIDAYS[dateStr];
          const workday = WORKDAYS[dateStr]; // 调休（补班）
          const weekend = isWeekend(dateStr) && !workday; // 调休日不算普通周末
          const hours = hoursByDate[dateStr];

          let bgClass = 'hover:bg-gray-50';
          let textClass = 'text-gray-700';

          if (isSelected) { bgClass = 'bg-blue-600'; textClass = 'text-white'; }
          else if (holiday) { bgClass = 'bg-red-50 hover:bg-red-100'; textClass = 'text-red-600'; }
          else if (workday) { bgClass = 'bg-purple-50 hover:bg-purple-100'; textClass = 'text-purple-700'; }
          else if (weekend) { bgClass = 'bg-orange-50 hover:bg-orange-100'; textClass = 'text-orange-500'; }

          return (
            <div
              key={dateStr}
              className={`calendar-day relative flex flex-col items-center justify-center rounded-lg cursor-pointer py-1 px-0.5 ${bgClass}`}
              style={{minHeight:'52px'}}
              onClick={() => onSelectDate(dateStr)}
            >
              <span className={`text-sm font-medium ${textClass} ${isToday && !isSelected ? 'ring-2 ring-blue-400 rounded-full w-6 h-6 flex items-center justify-center' : ''}`}>
                {new Date(dateStr).getDate()}
              </span>
              {holiday && (
                <span className={`text-xs leading-tight text-center ${isSelected ? 'text-blue-100' : 'text-red-400'}`} style={{fontSize:'9px',lineHeight:'1.1',maxWidth:'100%'}}>
                  {holiday}
                </span>
              )}
              {!holiday && workday && (
                <span className={`text-xs leading-tight text-center ${isSelected ? 'text-blue-100' : 'text-purple-500'}`} style={{fontSize:'9px',lineHeight:'1.1'}}>
                  {workday}
                </span>
              )}
              {hours != null && (
                <span className={`text-xs font-medium mt-0.5 ${isSelected ? 'text-blue-100' : 'text-blue-500'}`} style={{fontSize:'10px'}}>
                  {hours}h
                </span>
              )}
            </div>
          );
        })}
      </div>

      {/* 图例 */}
      <div className="flex flex-wrap gap-3 mt-3 pt-3 border-t border-gray-50">
        <span className="flex items-center gap-1 text-xs text-gray-400"><span className="w-3 h-3 rounded bg-blue-600 inline-block"></span>选中</span>
        <span className="flex items-center gap-1 text-xs text-gray-400"><span className="w-3 h-3 rounded bg-red-100 inline-block"></span>节假日</span>
        <span className="flex items-center gap-1 text-xs text-gray-400"><span className="w-3 h-3 rounded bg-purple-100 inline-block"></span>调休补班</span>
        <span className="flex items-center gap-1 text-xs text-gray-400"><span className="w-3 h-3 rounded bg-orange-50 border border-orange-200 inline-block"></span>周末</span>
      </div>
    </div>
  );
}

  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [showCalendar, setShowCalendar] = useState(true);

  const projects = useMemo(() => {
    const set = new Set(workRecords.map(r => r.project).filter(Boolean));
    return [...set].sort();
  }, [workRecords]);

  const dayRecords = useMemo(() =>
    workRecords.filter(r => r.date === selectedDate),
  [workRecords, selectedDate]);

  const dayHours = dayRecords.reduce((s, r) => s + r.hours, 0);
  const holiday = HOLIDAYS[selectedDate];
  const weekend = isWeekend(selectedDate);

  const handleSave = (form) => {
    if (editRecord) {
      setWorkRecords(workRecords.map(r => r.id === editRecord.id ? { ...r, ...form } : r));
    } else {
      setWorkRecords([...workRecords, { id: uid(), date: selectedDate, ...form, createdAt: new Date().toISOString() }]);
    }
    setShowForm(false);
    setEditRecord(null);
  };

  const handleDelete = (id) => {
    setWorkRecords(workRecords.filter(r => r.id !== id));
    setDeleteConfirm(null);
  };

    <div className={`${isMobile ? 'flex flex-col' : 'flex'} gap-4 h-full`}>

        {/* 头部 */}
        <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <div className="flex items-center gap-3">
            {isMobile && (
              <button
                onClick={() => setShowCalendar(v => !v)}
                className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400"
                title="切换日历"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" strokeWidth="2"/><line x1="16" y1="2" x2="16" y2="6" strokeWidth="2" strokeLinecap="round"/><line x1="8" y1="2" x2="8" y2="6" strokeWidth="2" strokeLinecap="round"/><line x1="3" y1="10" x2="21" y2="10" strokeWidth="2"/></svg>
              </button>

              <h2 className="font-semibold text-gray-800 text-base">{formatDate(selectedDate)}</h2>

                {holiday && <span className="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">{holiday}</span>}

              </div>
            </div>
          </div>

  );

// ─────────────────────────────────────────
// 可自定义选项的下拉选择器
// ─────────────────────────────────────────
function EditableSelect({ value, options, onChange, onAddOption, placeholder = '选择', className = '' }) {
  const [open, setOpen] = React.useState(false);
  const [portalStyle, setPortalStyle] = React.useState({});
  const [custom, setCustom] = React.useState('');
  const triggerRef = React.useRef(null);
  const dropdownRef = React.useRef(null);

  React.useEffect(() => {
    const handler = e => {
      if (
        triggerRef.current && !triggerRef.current.contains(e.target) &&
        dropdownRef.current && !dropdownRef.current.contains(e.target)
      ) setOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleToggle = () => {
    if (!open) {
      const rect = triggerRef.current?.getBoundingClientRect();
      if (rect) {
        const minW = Math.max(160, rect.width);
        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < 240) {
          setPortalStyle({ position: 'fixed', bottom: window.innerHeight - rect.top + 4, right: window.innerWidth - rect.right, minWidth: minW, zIndex: 9999 });
        } else {
          setPortalStyle({ position: 'fixed', top: rect.bottom + 4, right: window.innerWidth - rect.right, minWidth: minW, zIndex: 9999 });
        }
      }
    }
    setOpen(o => !o);
  };

  const addCustom = () => {
    const v = custom.trim();
    if (!v) return;
    if (!options.includes(v)) onAddOption(v);
    onChange(v);
    setCustom('');
    setOpen(false);
  };

  const dropdown = open && ReactDOM.createPortal(
    <div ref={dropdownRef} style={portalStyle} className="bg-white border border-gray-200 rounded-lg shadow-lg">
      <div className="max-h-44 overflow-y-auto">
        {options.map(o => (
          <div key={o}
            className={`px-3 py-1.5 text-xs cursor-pointer hover:bg-blue-50 ${o === value ? 'text-blue-600 font-medium bg-blue-50' : 'text-gray-700'}`}
            onMouseDown={e => { e.preventDefault(); onChange(o); setOpen(false); }}
          >{o}</div>
        ))}
      </div>
      <div className="border-t border-gray-100 p-2 flex gap-1">
        <input
          className="flex-1 text-xs border border-gray-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-300"
          placeholder="自定义…"
          value={custom}
          onChange={e => setCustom(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } }}
          onMouseDown={e => e.stopPropagation()}
        />
        <button type="button" onMouseDown={e => { e.preventDefault(); addCustom(); }} className="text-xs px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">+</button>
      </div>
    </div>,
    document.body
  );

  return (
    <div ref={triggerRef} className={`relative ${className}`} onClick={e => e.stopPropagation()}>
      <button
        type="button"
        onClick={handleToggle}
        className="border border-gray-200 rounded px-2 py-1 text-xs text-left w-full flex items-center justify-between gap-1 bg-white hover:border-blue-300"
      >
        <span className={value ? 'text-gray-800' : 'text-gray-400'}>{value || placeholder}</span>
        <span className="text-gray-400 shrink-0">▾</span>
      </button>
      {dropdown}
    </div>
  );
}

// ─────────────────────────────────────────
// 项目关键词搜索选择框
// ─────────────────────────────────────────
function SearchableProjectSelect({ projects, value, onChange, placeholder = '筛选项目…', className = '' }) {
  const [query, setQuery] = React.useState(value || '');
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  React.useEffect(() => { setQuery(value || ''); }, [value]);

  const filtered = query
    ? projects.filter(p => p.toLowerCase().includes(query.toLowerCase()))
    : projects;

  const select = p => { onChange(p); setQuery(p); setOpen(false); };
  const clear = () => { onChange(''); setQuery(''); };

  return (
    <div ref={ref} className={`relative ${className}`}>
      <div className="flex items-center border border-gray-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-300 bg-white">
        <input
          className="px-3 py-2 text-sm flex-1 focus:outline-none min-w-0"
          placeholder={placeholder}
          value={query}
          onChange={e => { setQuery(e.target.value); onChange(''); setOpen(true); }}
          onFocus={() => setOpen(true)}
        />
        {query ? (
          <button onClick={clear} className="px-2 text-gray-400 hover:text-gray-600 shrink-0">×</button>
        ) : (
          <span className="px-2 text-gray-300 shrink-0 text-sm">▾</span>
        )}
      </div>
      {open && filtered.length > 0 && (
        <div className="absolute z-50 bg-white border border-gray-200 rounded-lg shadow-lg mt-1 w-full max-h-52 overflow-y-auto scrollbar-thin">
          {filtered.map(p => (
            <div key={p}
              className={`px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 ${p === value ? 'text-blue-600 font-medium' : 'text-gray-700'}`}
              onMouseDown={e => { e.preventDefault(); select(p); }}
            >{p}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────
// 周报编辑器
// ─────────────────────────────────────────
function ReportEditor({ report, onSave, settings, setSettings, weeklyReports = [], workRecords = [], setWorkRecords }) {
  const [items, setItems] = useState(report.items || []);
  const [nextItems, setNextItems] = useState(report.nextItems || []);
  const [markdown, setMarkdown] = useState(report.markdown || '');
  const [mdMode, setMdMode] = useState(false);
  const [mdPreview, setMdPreview] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);
  const availableProviders = settings?.llm?.providers || DEFAULT_PROVIDERS;
  const [selectedProvider, setSelectedProvider] = useState(settings?.llm?.default || availableProviders[0]?.id || '');

  // 同步外部report变化
  useEffect(() => {
    setItems(report.items || []);
    setNextItems(report.nextItems || []);
    setMarkdown(report.markdown || '');
  }, [report.id]);

  const handleSave = () => {
    const md = mdMode ? markdown : buildMarkdown({ ...report, items, nextItems }, hoursByProject);
    const parsed = mdMode ? parseMarkdownToReport(markdown) : { items, nextItems };
    onSave({ ...report, ...parsed, markdown: md, updatedAt: new Date().toISOString() });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const handleCopy = () => {
    const md = mdMode ? markdown : buildMarkdown({ ...report, items, nextItems }, hoursByProject);
    navigator.clipboard.writeText(md);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleAiGen = async (providerOverride) => {
    setAiError('');
    setAiLoading(true);
    try {
      // 历史周报（排除当前，按时间倒序）
      const pastReports = weeklyReports
        .filter(r => r.id !== report.id && r.markdown)
        .sort((a, b) => b.weekStart.localeCompare(a.weekStart));

      // 风格示例：最近2份
      const styleExamples = pastReports.slice(0, 2);

      // 修正对比：有 aiGenerated 且与 markdown 不同的报告（最近3份）
      const corrections = pastReports
        .filter(r => r.aiGenerated && r.aiGenerated !== r.markdown)
        .slice(0, 3);

      // 上周项目背景：最近1份周报的条目
      const lastReport = pastReports[0];

      // 构建 prompt
      let prompt = `你是工作周报助手。请根据本周工作记录生成一份专业的中文工作周报。\n\n`;

      if (styleExamples.length > 0) {
        prompt += `【公司周报风格参考 - 请严格模仿以下示例的措辞和表述习惯】\n`;
        styleExamples.forEach((r, i) => {
          prompt += `\n=== 示例${i + 1}（${r.range}周）===\n${r.markdown}\n`;
        });
        prompt += `\n`;
      }

      if (corrections.length > 0) {
        prompt += `【历史修正记录 - 以下是AI生成后用户修改的内容，请学习用户偏好避免重犯】\n`;
        corrections.forEach((r, i) => {
          prompt += `\n修正${i + 1}（${r.range}周）：\nAI生成：\n${r.aiGenerated}\n用户修改为：\n${r.markdown}\n`;
        });
        prompt += `\n`;
      }

      if (lastReport) {
        prompt += `【上周项目状态参考 - 帮助你理解各项目当前所处阶段】\n`;
        (lastReport.items || []).forEach(it => {
          prompt += `- 项目「${it.project}」上周状态：${it.progress}，内容：${it.content}\n`;
        });
        prompt += `\n`;
      }

      const dailyLines = weekRecords
        .slice().sort((a, b) => a.date.localeCompare(b.date) || a.project.localeCompare(b.project))
        .map(r => `- ${r.date} 项目「${r.project}」：${r.content}（${r.hours}h）`)
        .join('\n');
      prompt += `【本周每日工作明细（主要输入，请以此为准整理周报）】\n`;
      prompt += dailyLines || '（本周无工作记录）';
      prompt += `\n\n`;

      if (items.length > 0) {
        prompt += `【当前周报草稿（供参考）】\n`;
        prompt += items.map(it => `- 项目「${it.project}」：${it.content}，进度：${it.progress}`).join('\n');
        prompt += `\n\n`;
      }

      // 按项目汇总工时供 AI 参考
      const aiHoursByProject = {};
      weekRecords.forEach(r => { aiHoursByProject[r.project] = (aiHoursByProject[r.project] || 0) + r.hours; });
      const hoursLines = Object.entries(aiHoursByProject).map(([p, h]) => `- 项目「${p}」：${h}h`).join('\n');
      if (hoursLines) prompt += `【本周各项目工时汇总】\n${hoursLines}\n\n`;

      prompt += `要求：
1. 开头加上：您好：\n\n本周(${report.range})的工作总结具体如下，请查收。
2. 生成"本周工作内容"表格，列：项目 | 工时 | 工作内容 | 项目进度 | 备注（工时填写实际工时，如"9h"）
3. 生成"下周工作计划"表格，列：项目 | 工作内容（根据本周进展合理推测，用户会自行修改）
4. 只输出Markdown内容，不要其他说明`;

      const settingsCopy = { ...settings, llm: { ...settings.llm, default: providerOverride || selectedProvider } };
      const result = await callAI(settingsCopy, prompt);

      // 保存 AI 原始输出，用于后续修正对比
      onSave({ ...report, aiGenerated: result, updatedAt: new Date().toISOString() });

      setMarkdown(result);
      const parsed = parseMarkdownToReport(result);
      if (parsed.items.length) setItems(parsed.items);
      if (parsed.nextItems.length) setNextItems(parsed.nextItems);
      setMdMode(true);
    } catch (e) {
      setAiError(e.message);
    } finally {
      setAiLoading(false);
    }
  };

  const addItem = () => setItems([...items, { id: uid(), project: '', content: '', progress: '开发中', note: '' }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, val) => setItems(items.map(i => i.id === id ? {...i, [field]: val} : i));

  const addNextItem = () => setNextItems([...nextItems, { id: uid(), project: '', content: '' }]);
  const removeNextItem = (id) => setNextItems(nextItems.filter(i => i.id !== id));
  const updateNextItem = (id, field, val) => setNextItems(nextItems.map(i => i.id === id ? {...i, [field]: val} : i));

  const weekRecords = useMemo(() => workRecords.filter(r => r.date >= report.weekStart && r.date <= report.weekEnd), [workRecords, report.weekStart, report.weekEnd]);
  const hoursByProject = useMemo(() => {
    const map = {};
    weekRecords.forEach(r => { map[r.project] = (map[r.project] || 0) + r.hours; });
    return map;
  }, [weekRecords]);
  const totalWeekHours = useMemo(() => weekRecords.reduce((s, r) => s + r.hours, 0), [weekRecords]);

  const handleHoursChange = (project, newTotal) => {
    if (!setWorkRecords) return;
    const projRecs = weekRecords.filter(r => r.project === project);
    const otherDaysHours = projRecs.filter(r => r.date !== report.weekEnd).reduce((s, r) => s + r.hours, 0);
    const lastDayHours = Math.max(0, Math.round((newTotal - otherDaysHours) * 10) / 10);
    const existing = projRecs.find(r => r.date === report.weekEnd);
    if (existing) {
      setWorkRecords(workRecords.map(r => r.id === existing.id ? { ...r, hours: lastDayHours } : r));
    } else {
      setWorkRecords([...workRecords, { id: uid(), date: report.weekEnd, project, content: project, hours: lastDayHours, createdAt: new Date().toISOString() }]);
    }
  };

  // 新建周报时自动触发 AI 生成
  useEffect(() => {
    if (report.autoAI) {
      onSave({ ...report, autoAI: false, updatedAt: new Date().toISOString() });
      handleAiGen(report.autoAIProvider || undefined);
    }
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // providerLabels 从 settings 动态取

  return (
    <div className="flex flex-col h-full">
      {/* 工具栏 */}
      <div className="border-b border-gray-100">
        {/* 行1：标题 + 保存 */}
        <div className="flex items-center justify-between px-5 pt-3 pb-2">
          <div>
            <h3 className="font-semibold text-gray-800">第 {report.range} 周</h3>
            <span className="text-xs text-gray-400">{report.weekStart} ～ {report.weekEnd}</span>
          </div>
          <button onClick={handleSave} className={`px-3 py-1.5 text-xs rounded-lg font-medium transition-colors ${saved ? 'bg-green-500 text-white' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
            {saved ? '已保存 ✓' : '保存'}
          </button>
        </div>
        {/* 行2：AI + 模式切换（统一高度 h-8） */}
        <div className="flex items-center gap-2 px-5 pb-3 flex-wrap">
          <div className="flex items-center gap-1 bg-gray-50 border border-gray-200 rounded-lg px-2 h-8">
            <select
              className="text-xs text-gray-600 bg-transparent outline-none h-full"
              value={selectedProvider}
              onChange={e => setSelectedProvider(e.target.value)}
            >
              {availableProviders.map(p => (
                <option key={p.id} value={p.id}>{p.label}</option>
              ))}
            </select>
            <span className="text-gray-300 mx-1 select-none">|</span>
            <button
              onClick={() => handleAiGen()}
              disabled={aiLoading}
              className="text-xs text-blue-600 hover:text-blue-700 font-medium disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
            >
              {aiLoading ? '生成中...' : 'AI 重新生成'}
            </button>
          </div>
          <div className="flex bg-gray-50 border border-gray-200 rounded-lg overflow-hidden text-xs h-8">
            <button onClick={() => { setMdMode(false); setMdPreview(false); }} className={`px-3 h-full transition-colors ${!mdMode ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}>结构化</button>
            <button onClick={() => { if (!mdMode) setMarkdown(buildMarkdown({ ...report, items, nextItems }, hoursByProject)); setMdMode(true); }} className={`px-3 h-full transition-colors ${mdMode ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}>Markdown</button>
          </div>
        </div>
      </div>

      {/* Markdown 操作区 */}
      {mdMode && (
        <div className="flex items-center justify-between px-5 py-2 bg-gray-50 border-b border-gray-100">
          <span className="text-xs font-semibold text-gray-400 tracking-widest uppercase">Markdown</span>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setMdPreview(v => !v)}
              className={`px-3 py-1 text-xs rounded-md border transition-colors ${mdPreview ? 'bg-indigo-50 border-indigo-200 text-indigo-600' : 'border-gray-200 text-gray-500 bg-white hover:border-gray-300'}`}
            >
              {mdPreview ? '编辑源码' : '预览'}
            </button>
            <button
              onClick={handleCopy}
              className={`px-3 py-1 text-xs rounded-md border transition-colors ${copied ? 'bg-green-50 border-green-200 text-green-600' : 'border-gray-200 text-gray-500 bg-white hover:border-gray-300'}`}
            >
              {copied ? '已复制 ✓' : '复制'}
            </button>
          </div>
        </div>
      )}

      {aiError && (
        <div className="mx-5 mt-3 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-2 rounded-lg">{aiError}</div>
      )}

      <div className="flex-1 overflow-y-auto p-5 space-y-6 scrollbar-thin">
        {mdMode ? (
          mdPreview ? (
            <div
              className="md-preview w-full border border-gray-200 rounded-lg p-5 bg-white"
              style={{minHeight:'500px'}}
              dangerouslySetInnerHTML={{__html: renderMarkdown(markdown)}}
            />
          ) : (
            <textarea
              className="w-full border border-gray-200 rounded-lg p-4 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-300"
              style={{minHeight:'500px'}}
              value={markdown}
              onChange={e => { setMarkdown(e.target.value); const p = parseMarkdownToReport(e.target.value); if(p.items.length) setItems(p.items); if(p.nextItems.length) setNextItems(p.nextItems); }}
            />
          )
        ) : (
          <>
            {/* 本周工作内容 */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <h4 className="font-semibold text-gray-700 text-sm">本周工作内容</h4>
                <button onClick={addItem} className="text-xs text-blue-600 hover:text-blue-700 flex items-center gap-1">
                  <span>+</span> 添加行
                </button>
              </div>
              <div className="border border-gray-200 rounded-lg overflow-hidden">
                <div className="grid bg-gray-50 border-b border-gray-200 text-xs font-medium text-gray-500 px-3 py-2" style={{gridTemplateColumns:'1fr 2fr 60px 1fr 1fr auto'}}>
                  <span>项目</span><span>工作内容</span><span>本周工时</span><span>项目进度</span><span>备注</span><span></span>
                </div>
                {totalWeekHours > 0 && (
                  <div className="grid items-center px-3 py-2 gap-2 bg-blue-50 border-b border-blue-100 text-xs font-medium text-blue-700" style={{gridTemplateColumns:'1fr 2fr 60px 1fr 1fr auto'}}>
                    <span>本周合计</span><span></span><span className="font-bold">{totalWeekHours}h</span><span></span><span></span><span></span>
                  </div>
                )}
                {items.map((it, idx) => (
                  <div key={it.id} className={`grid items-center px-3 py-2 gap-2 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`} style={{gridTemplateColumns:'1fr 2fr 60px 1fr 1fr auto'}}>
                    <input className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-300" value={it.project} onChange={e => updateItem(it.id, 'project', e.target.value)} placeholder="项目名" />
                    <input className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-300" value={it.content} onChange={e => updateItem(it.id, 'content', e.target.value)} placeholder="工作内容" />
                    <input
                      type="number" min="0" step="0.5"
                      className="w-full border border-blue-200 rounded px-1 py-1 text-xs text-blue-700 font-medium text-center focus:outline-none focus:ring-1 focus:ring-blue-400 bg-blue-50"
                      value={hoursByProject[it.project] ?? ''}
                      placeholder="0"
                      onChange={e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) handleHoursChange(it.project, v); }}
                    />
                    <EditableSelect
                      value={it.progress || '开发中'}
                      options={settings.progressOptions || DEFAULT_PROGRESS_OPTIONS}
                      onChange={v => updateItem(it.id, 'progress', v)}
                      onAddOption={v => setSettings({ ...settings, progressOptions: [...(settings.progressOptions || DEFAULT_PROGRESS_OPTIONS), v] })}
                    />
                    <input className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-300" value={it.note||''} onChange={e => updateItem(it.id, 'note', e.target.value)} placeholder="备注" />
                    <button onClick={() => removeItem(it.id)} className="text-gray-300 hover:text-red-400 text-lg leading-none">&times;</button>
                  </div>
                ))}
                {items.length === 0 && <div className="text-center text-gray-300 text-sm py-4">暂无数据</div>}
              </div>
            </div>

            {/* 下周工作计划 */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <h4 className="font-semibold text-gray-700 text-sm">下周工作计划</h4>
                <button onClick={addNextItem} className="text-xs text-blue-600 hover:text-blue-700 flex items-center gap-1">
                  <span>+</span> 添加行
                </button>
              </div>
              <div className="border border-gray-200 rounded-lg overflow-hidden">
                <div className="grid bg-gray-50 border-b border-gray-200 text-xs font-medium text-gray-500 px-3 py-2" style={{gridTemplateColumns:'1fr 2fr auto'}}>
                  <span>项目</span><span>工作内容</span><span></span>
                </div>
                {nextItems.map((it, idx) => (
                  <div key={it.id} className={`grid items-center px-3 py-2 gap-2 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`} style={{gridTemplateColumns:'1fr 2fr auto'}}>
                    <input className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-300" value={it.project} onChange={e => updateNextItem(it.id, 'project', e.target.value)} placeholder="项目名" />
                    <input className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-300" value={it.content} onChange={e => updateNextItem(it.id, 'content', e.target.value)} placeholder="下周计划" />
                    <button onClick={() => removeNextItem(it.id)} className="text-gray-300 hover:text-red-400 text-lg leading-none">&times;</button>
                  </div>
                ))}
                {nextItems.length === 0 && <div className="text-center text-gray-300 text-sm py-4">暂无数据</div>}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// 周选择弹窗
// ─────────────────────────────────────────
function WeekPickerModal({ onConfirm, onClose, workRecords, weeklyReports, settings }) {
  const thisMonday = getMonday(today());
  const thisSunday = getSunday(today());
  const [startDate, setStartDate] = useState(thisMonday);
  const [endDate, setEndDate]     = useState(thisSunday);
  const availableProviders = settings?.llm?.providers || DEFAULT_PROVIDERS;
  const [selectedAIProvider, setSelectedAIProvider] = useState(settings?.llm?.default || availableProviders[0]?.id || '');

  // 日期合法性：结束不早于开始
  const isValid = endDate >= startDate;

  const records = isValid ? workRecords.filter(r => r.date >= startDate && r.date <= endDate) : [];
  const totalHours = records.reduce((s, r) => s + r.hours, 0);
  const existing = weeklyReports.find(r => r.weekStart === startDate && r.weekEnd === endDate);

  // 整体前移/后移 7 天（保持时间跨度不变）
  const spanDays = isValid ? Math.round((new Date(endDate) - new Date(startDate)) / 86400000) : 6;
  const shiftBack = () => {
    setStartDate(addDays(startDate, -7));
    setEndDate(addDays(endDate, -7));
  };
  const shiftForward = () => {
    setStartDate(addDays(startDate, 7));
    setEndDate(addDays(endDate, 7));
  };
  const goThisWeek = () => { setStartDate(thisMonday); setEndDate(thisSunday); };

  const isThisWeek = startDate === thisMonday && endDate === thisSunday;

  // 工作记录按日期分组
  const byDate = {};
  records.forEach(r => { if (!byDate[r.date]) byDate[r.date] = []; byDate[r.date].push(r); });
  const sortedDates = Object.keys(byDate).sort();

  return (
    <Modal title="选择周期" onClose={onClose} width="max-w-md">
      <div className="space-y-5">

        {/* 日期范围选择 */}
        <div className="bg-gray-50 rounded-xl p-4 space-y-3">
          <div className="flex items-center gap-2">
            <button onClick={shiftBack} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-200 text-gray-400 text-xl leading-none shrink-0" title="整体前移一周">‹</button>
            <div className="flex-1 flex items-center gap-2">
              <div className="flex-1">
                <div className="text-xs text-gray-400 mb-1 text-center">开始日期</div>
                <input
                  type="date"
                  className="w-full border border-gray-200 bg-white rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300"
                  value={startDate}
                  onChange={e => {
                    const v = e.target.value;
                    setStartDate(v);
                    // 若结束早于开始则自动同步
                    if (v > endDate) setEndDate(v);
                  }}
                />
              </div>
              <span className="text-gray-400 text-sm shrink-0 mt-4">—</span>
              <div className="flex-1">
                <div className="text-xs text-gray-400 mb-1 text-center">结束日期</div>
                <input
                  type="date"
                  className="w-full border border-gray-200 bg-white rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300"
                  value={endDate}
                  min={startDate}
                  onChange={e => setEndDate(e.target.value)}
                />
              </div>
            </div>
            <button onClick={shiftForward} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-200 text-gray-400 text-xl leading-none shrink-0" title="整体后移一周">›</button>
          </div>

          {/* 快捷标签 */}
          <div className="flex items-center gap-2 justify-center flex-wrap">
            <button
              onClick={goThisWeek}
              className={`text-xs px-3 py-1 rounded-full border transition-colors ${isThisWeek ? 'bg-blue-600 border-blue-600 text-white' : 'border-gray-300 text-gray-500 hover:border-blue-400 hover:text-blue-600'}`}
            >本周（周一—周日）</button>
            <button
              onClick={() => { setStartDate(addDays(thisMonday, -7)); setEndDate(addDays(thisSunday, -7)); }}
              className="text-xs px-3 py-1 rounded-full border border-gray-300 text-gray-500 hover:border-blue-400 hover:text-blue-600 transition-colors"
            >上周</button>
            {isValid && spanDays !== 6 && (
              <span className="text-xs text-gray-400">共 {spanDays + 1} 天</span>
            )}
          </div>
        </div>

        {/* 工作记录预览 */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <span className="text-sm font-medium text-gray-600">所选时段工作记录</span>
            {records.length > 0 && (
              <span className="text-xs text-gray-400">{records.length} 条，共 <span className="text-blue-600 font-medium">{totalHours}h</span></span>
            )}
          </div>
          {!isValid ? (
            <div className="text-center py-4 text-red-400 bg-red-50 rounded-lg text-xs">结束日期不能早于开始日期</div>
          ) : records.length === 0 ? (
            <div className="text-center py-6 text-gray-300 bg-gray-50 rounded-lg">
              <svg className="w-8 h-8 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
              <p className="text-xs">该时段暂无工作记录</p>
            </div>
          ) : (
            <div className="border border-gray-100 rounded-lg overflow-hidden max-h-44 overflow-y-auto scrollbar-thin">
              {sortedDates.map(date => (
                <div key={date} className="border-b border-gray-50 last:border-0">
                  <div className="px-3 py-1.5 bg-gray-50 text-xs font-medium text-gray-500 flex justify-between">
                    <span>{formatDate(date)}</span>
                    <span className="text-blue-500">{byDate[date].reduce((s,r)=>s+r.hours,0)}h</span>
                  </div>
                  {byDate[date].map(r => (
                    <div key={r.id} className="px-3 py-1.5 flex items-center gap-2 text-xs text-gray-600">
                      <span className="font-medium text-gray-700 shrink-0">{r.project}</span>
                      <span className="text-gray-400">·</span>
                      <span className="truncate">{r.content}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* 覆盖提示 */}
        {existing && (
          <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
            <svg className="w-4 h-4 text-amber-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            <span className="text-xs text-amber-700">该时段已有周报，生成后将覆盖原有内容</span>
          </div>
        )}

        {/* AI 模型选择 + 操作按钮 */}
        <div className="flex items-center justify-between gap-2 pt-1">
          <div className="flex items-center gap-2">
            <span className="text-xs text-gray-500 shrink-0">AI 模型</span>
            <select
              className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white"
              value={selectedAIProvider}
              onChange={e => setSelectedAIProvider(e.target.value)}
            >
              {availableProviders.map(p => (
                <option key={p.id} value={p.id}>{p.label || p.name || p.id}</option>
              ))}
            </select>
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
            <button
              disabled={!isValid}
              onClick={() => onConfirm(startDate, endDate, records.length === 0, selectedAIProvider)}
              className="px-5 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-40 disabled:cursor-not-allowed"
            >
              生成周报
            </button>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function ImportModal({ onClose, onImport, weeklyReports }) {
  const [preview, setPreview] = useState(null);
  const [conflict, setConflict] = useState('skip');
  const [error, setError] = useState('');

  // 解析 Excel 日期单元格（支持 JS Date / 中文字符串 / Excel 序列数）
  function parseDateCell(val) {
    if (!val && val !== 0) return null;
    if (val instanceof Date) return fmt(val);
    if (typeof val === 'number') {
      const d = new Date(Math.round((val - 25569) * 86400 * 1000));
      return fmt(d);
    }
    if (typeof val === 'string') {
      const m = val.match(/(\d+)月(\d+)/);
      if (m) {
        const year = new Date().getFullYear();
        return `${year}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
      }
      const d = new Date(val);
      if (!isNaN(d)) return fmt(d);
    }
    return null;
  }

  // 在对象的 key 里找匹配关键词的列名
  function detectCol(keys, ...keywords) {
    return keys.find(k => keywords.some(kw => k.includes(kw))) || null;
  }

  const handleFile = async (e) => {
    setError('');
    setPreview(null);
    const file = e.target.files[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) { setError('表格为空或格式不支持'); return; }

      const keys = Object.keys(rows[0]);
      const colDate    = detectCol(keys, '日期');
      const colProject = detectCol(keys, '项目');
      const colContent = detectCol(keys, '内容');
      const colHours   = detectCol(keys, '时', '工时', '小时');
      const colWeekNum = detectCol(keys, '周数', '周次');

      if (!colDate || !colProject || !colContent) {
        setError('未找到必要列（日期、项目、内容），请检查表格表头');
        return;
      }

      // 按 weekEnd 日期分组
      const weekMap = {};
      let skipped = 0;
      rows.forEach(row => {
        const dateStr = parseDateCell(row[colDate]);
        if (!dateStr) { skipped++; return; }
        const project = String(row[colProject] || '').trim();
        const content = String(row[colContent] || '').trim();
        if (!project && !content) { skipped++; return; }

        const weekEnd   = getSunday(dateStr);
        const weekStart = getMonday(dateStr);
        const weekNum   = colWeekNum ? row[colWeekNum] : '';
        const hours     = colHours ? (parseFloat(row[colHours]) || 0) : 0;

        if (!weekMap[weekEnd]) weekMap[weekEnd] = { weekEnd, weekStart, weekNum, records: [] };
        weekMap[weekEnd].records.push({ project, content, hours, date: dateStr });
      });

      const weeks = Object.values(weekMap).sort((a, b) => b.weekEnd.localeCompare(a.weekEnd));
      if (!weeks.length) { setError('没有解析到有效数据'); return; }
      setPreview({ weeks, totalRows: rows.length - skipped, skipped });
    } catch (e) {
      setError('解析失败：' + e.message);
    }
  };

  const handleConfirm = () => {
    if (!preview) return;
    onImport(preview.weeks, conflict);
  };

  const existingWeekEnds = new Set(weeklyReports.map(r => r.weekEnd));
  const conflictCount = preview ? preview.weeks.filter(w => existingWeekEnds.has(w.weekEnd)).length : 0;

  return (
    <Modal title="导入历史数据" onClose={onClose} width="max-w-lg">
      <div className="space-y-4">
        <div>
          <label className="block text-sm text-gray-600 mb-1.5">选择 Excel 文件（.xlsx / .xls / .csv）</label>
          <input
            type="file" accept=".xlsx,.xls,.csv"
            onChange={handleFile}
            className="block w-full text-sm text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 cursor-pointer"
          />
          <p className="text-xs text-gray-400 mt-1">表头需包含：日期、项目、内容（工时列可选）</p>
        </div>

        {error && <p className="text-sm text-red-500 bg-red-50 rounded-lg px-3 py-2">{error}</p>}

        {preview && (
          <>
            <div className="bg-gray-50 rounded-lg p-3 text-sm">
              <p className="text-gray-700 font-medium mb-2">
                解析结果：{preview.totalRows} 条记录，{preview.weeks.length} 个周次
                {preview.skipped > 0 && <span className="text-gray-400 ml-1">（跳过 {preview.skipped} 条无效行）</span>}
              </p>
              <div className="max-h-48 overflow-y-auto scrollbar-thin space-y-1">
                {preview.weeks.map(w => {
                  const isConflict = existingWeekEnds.has(w.weekEnd);
                  return (
                    <div key={w.weekEnd} className={`flex items-center justify-between px-2 py-1 rounded text-xs ${isConflict ? 'bg-amber-50 text-amber-700' : 'bg-white text-gray-600'}`}>
                      <span>{w.weekNum ? `第${w.weekNum}周 ` : ''}{w.weekStart} ～ {w.weekEnd}</span>
                      <span className="text-gray-400">{w.records.length} 条{isConflict ? ' ⚠️已存在' : ''}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {conflictCount > 0 && (
              <div className="space-y-1.5">
                <p className="text-sm text-amber-600 font-medium">有 {conflictCount} 个周次已存在，如何处理？</p>
                <label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                  <input type="radio" name="conflict" value="skip" checked={conflict === 'skip'} onChange={() => setConflict('skip')} />
                  跳过（保留已有数据）
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                  <input type="radio" name="conflict" value="overwrite" checked={conflict === 'overwrite'} onChange={() => setConflict('overwrite')} />
                  覆盖（替换为导入数据）
                </label>
              </div>
            )}

            <div className="flex justify-end gap-2 pt-1">
              <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">取消</button>
              <button onClick={handleConfirm} className="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                确认导入
              </button>
            </div>
          </>
        )}
      </div>
    </Modal>
  );
}

function WeeklyReportPage({ workRecords, setWorkRecords, weeklyReports, setWeeklyReports, settings, setSettings }) {
  const [selectedId, setSelectedId] = useState(weeklyReports[0]?.id || null);
  const [showPicker, setShowPicker] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [mobileTab, setMobileTab] = useState('list'); // 'list' | 'editor'
  const isMobile = useIsMobile();

  const selectedReport = weeklyReports.find(r => r.id === selectedId);

  const handleConfirmGenerate = (weekStart, weekEnd, isEmpty, aiProvider) => {
    if (isEmpty && !window.confirm('该时段没有工作记录，是否仍要生成空白周报？')) return;
    setShowPicker(false);

    const records = workRecords.filter(r => r.date >= weekStart && r.date <= weekEnd);
    const existing = weeklyReports.find(r => r.weekStart === weekStart && r.weekEnd === weekEnd);

    const generated = generateReportFromRecords(weekStart, records, weekEnd);
    const newReport = { id: uid(), ...generated, weekEnd, autoAI: true, autoAIProvider: aiProvider || '', generatedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };

    let newReports;
    if (existing) {
      newReports = weeklyReports.map(r => (r.weekStart === weekStart && r.weekEnd === weekEnd) ? { ...newReport, id: r.id } : r);
    } else {
      newReports = [newReport, ...weeklyReports].sort((a, b) => b.weekStart.localeCompare(a.weekStart));
    }
    setWeeklyReports(newReports);
    setSelectedId(existing ? existing.id : newReport.id);
  };

  const handleSaveReport = (updated) => {
    setWeeklyReports(weeklyReports.map(r => r.id === updated.id ? updated : r));
  };

  const handleDeleteReport = (id) => {
    if (!window.confirm('确定删除这份周报？')) return;
    const newReports = weeklyReports.filter(r => r.id !== id);
    setWeeklyReports(newReports);
    setSelectedId(newReports[0]?.id || null);
  };

  const handleImport = (weeks, conflict) => {
    const existingWeekEnds = new Set(weeklyReports.map(r => r.weekEnd));
    const newWorkRecords = [...workRecords];
    let newReports = [...weeklyReports];

    weeks.forEach(w => {
      const isConflict = existingWeekEnds.has(w.weekEnd);
      if (isConflict && conflict === 'skip') return;

      // 工作记录：冲突周先删旧的再追加
      if (isConflict && conflict === 'overwrite') {
        const toRemove = new Set(workRecords.filter(r => r.date >= w.weekStart && r.date <= w.weekEnd).map(r => r.id));
        newWorkRecords.splice(0, newWorkRecords.length, ...newWorkRecords.filter(r => !toRemove.has(r.id)));
      }
      w.records.forEach(rec => {
        newWorkRecords.push({ id: uid(), date: rec.date, project: rec.project, content: rec.content, hours: rec.hours, createdAt: new Date().toISOString() });
      });

      // 周报：用模板生成
      const generated = generateReportFromRecords(w.weekStart, w.records, w.weekEnd);
      const newReport = { id: uid(), ...generated, weekEnd: w.weekEnd, generatedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      if (isConflict && conflict === 'overwrite') {
        newReports = newReports.map(r => r.weekEnd === w.weekEnd ? { ...newReport, id: r.id } : r);
      } else {
        newReports.push(newReport);
      }
    });

    newReports.sort((a, b) => b.weekStart.localeCompare(a.weekStart));
    setWorkRecords(newWorkRecords);
    setWeeklyReports(newReports);
    setShowImport(false);
    setSelectedId(newReports[0]?.id || null);
  };

  const reportList = (
    <div className={`bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col ${isMobile ? 'h-full' : ''}`} style={isMobile ? {} : {width:'220px',flexShrink:0}}>
      <div className="p-4 border-b border-gray-100 space-y-2">
        <button
          onClick={() => setShowPicker(true)}
          className="w-full bg-blue-600 text-white text-sm py-2.5 rounded-lg hover:bg-blue-700 font-medium flex items-center justify-center gap-2"
        >
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
          生成周报
        </button>
        <button
          onClick={() => setShowImport(true)}
          className="w-full border border-gray-200 text-gray-600 text-sm py-2 rounded-lg hover:bg-gray-50 font-medium flex items-center justify-center gap-2"
        >
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
          导入历史数据
        </button>
      </div>
      <div className="flex-1 overflow-y-auto scrollbar-thin p-2">
        {weeklyReports.length === 0 ? (
          <div className="text-center text-gray-300 text-sm py-8 px-3">
            <svg className="w-10 h-10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            <p>点击上方按钮<br/>生成第一份周报</p>
          </div>
        ) : [...weeklyReports].sort((a, b) => b.weekStart.localeCompare(a.weekStart)).map(r => (
          <div
            key={r.id}
            className={`group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer mb-1 ${selectedId === r.id ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50'}`}
            onClick={() => { setSelectedId(r.id); if (isMobile) setMobileTab('editor'); }}
          >
            <div className="min-w-0">
              <div className={`text-sm font-medium truncate ${selectedId === r.id ? 'text-blue-700' : 'text-gray-700'}`}>{r.range}</div>
              <div className="text-xs text-gray-400">{r.weekStart.slice(0,4)}年</div>
            </div>
            <button
              onClick={e => { e.stopPropagation(); handleDeleteReport(r.id); }}
              className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-lg leading-none transition-opacity ml-1 shrink-0"
            >&times;</button>
          </div>
        ))}
      </div>
    </div>
  );

  const reportEditor = (
    <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
      {isMobile && (
        <button onClick={() => setMobileTab('list')} className="flex items-center gap-1.5 px-4 py-3 text-sm text-gray-500 hover:text-gray-700 border-b border-gray-100">
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
          返回列表
        </button>
      )}
      {selectedReport ? (
        <ReportEditor report={selectedReport} onSave={handleSaveReport} settings={settings} setSettings={setSettings} weeklyReports={weeklyReports} workRecords={workRecords} setWorkRecords={setWorkRecords} />
      ) : (
        <div className="flex flex-col items-center justify-center h-full text-gray-300">
          <svg className="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <p className="text-sm">选择周报或点击「生成周报」</p>
        </div>
      )}
    </div>
  );

  return (
    <div className={`${isMobile ? 'flex flex-col' : 'flex'} gap-4 h-full`}>
      {isMobile ? (
        mobileTab === 'list' ? reportList : reportEditor
      ) : (
        <>
          {reportList}
          {reportEditor}
        </>
      )}

      {showPicker && (
        <WeekPickerModal
          onConfirm={handleConfirmGenerate}
          onClose={() => setShowPicker(false)}
          workRecords={workRecords}
          weeklyReports={weeklyReports}
          settings={settings}
        />
      )}
      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          onImport={handleImport}
          weeklyReports={weeklyReports}
        />
      )}
    </div>
  );
}

function WorkDetailPage({ workRecords, setWorkRecords }) {
  const [search, setSearch] = useState('');
  const [filterProject, setFilterProject] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [sortBy, setSortBy] = useState('date_desc');
  const [editRecord, setEditRecord] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const projects = useMemo(() => [...new Set(workRecords.map(r => r.project).filter(Boolean))].sort(), [workRecords]);

  const filtered = useMemo(() => {
    let list = [...workRecords];
    if (filterProject) list = list.filter(r => r.project === filterProject);
    if (search) list = list.filter(r => r.project.includes(search) || r.content.includes(search));
    if (startDate) list = list.filter(r => r.date >= startDate);
    if (endDate) list = list.filter(r => r.date <= endDate);
    const [field, dir] = sortBy.split('_');
    list.sort((a, b) => {
      const va = field === 'hours' ? a.hours : a[field];
      const vb = field === 'hours' ? b.hours : b[field];
      return dir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });
    return list;
  }, [workRecords, search, filterProject, startDate, endDate, sortBy]);

  const totalHours = filtered.reduce((s, r) => s + r.hours, 0);
  const uniqueProjects = new Set(filtered.map(r => r.project)).size;

  const handleSave = (form) => {
    setWorkRecords(workRecords.map(r => r.id === editRecord.id ? { ...r, ...form } : r));
    setEditRecord(null);
  };

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
      {/* 筛选工具栏 */}
      <div className="p-4 border-b border-gray-100 space-y-3">
        <div className="flex gap-3 flex-wrap">
          <SearchableProjectSelect
            projects={projects}
            value={filterProject}
            onChange={setFilterProject}
            placeholder="筛选项目…"
            className="flex-1"
            style={{minWidth:'150px'}}
          />
          <input
            className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 flex-1"
            style={{minWidth:'120px'}}
            placeholder="搜索内容关键词…"
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
          <input type="date" className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" value={startDate} onChange={e => setStartDate(e.target.value)} />
          <span className="text-gray-400 self-center">至</span>
          <input type="date" className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" value={endDate} onChange={e => setEndDate(e.target.value)} />
          <select className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" value={sortBy} onChange={e => setSortBy(e.target.value)}>
            <option value="date_desc">日期 ↓</option>
            <option value="date_asc">日期 ↑</option>
            <option value="hours_desc">工时 ↓</option>
            <option value="hours_asc">工时 ↑</option>
          </select>
        </div>
        {/* 统计 */}
        <div className="flex gap-4 text-sm text-gray-500">
          <span>共 <strong className="text-gray-700">{filtered.length}</strong> 条记录</span>
          <span>总工时 <strong className="text-blue-600">{totalHours.toFixed(1)}h</strong> / <strong className="text-blue-600">{(totalHours/7.5).toFixed(1)}人天</strong></span>
          <span>涉及 <strong className="text-gray-700">{uniqueProjects}</strong> 个项目</span>
        </div>
      </div>

      {/* 列表 */}
      <div className="flex-1 overflow-y-auto scrollbar-thin">
        {filtered.length === 0 ? (
          <div className="flex flex-col items-center justify-center h-40 text-gray-300">
            <p className="text-sm">暂无记录</p>
          </div>
        ) : (
          <table className="w-full text-sm">
            <thead className="bg-gray-50 sticky top-0">
              <tr>
                <th className="text-left px-4 py-3 text-gray-500 font-medium">日期</th>
                <th className="text-left px-4 py-3 text-gray-500 font-medium">项目</th>
                <th className="text-left px-4 py-3 text-gray-500 font-medium">工作内容</th>
                <th className="text-right px-4 py-3 text-gray-500 font-medium">工时</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((rec, idx) => (
                <tr key={rec.id} className={`border-t border-gray-50 hover:bg-blue-50 group ${idx % 2 === 0 ? '' : 'bg-gray-50'}`}>
                  <td className="px-4 py-3 text-gray-500 whitespace-nowrap">{rec.date}</td>
                  <td className="px-4 py-3 font-medium text-gray-700 whitespace-nowrap">{rec.project}</td>
                  <td className="px-4 py-3 text-gray-600">{rec.content}</td>
                  <td className="px-4 py-3 text-right font-medium text-blue-600 whitespace-nowrap">{rec.hours}h</td>
                  <td className="px-4 py-3">
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 justify-end">
                      <button onClick={() => setEditRecord(rec)} className="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-100 rounded">
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                      </button>
                      <button onClick={() => setDeleteConfirm(rec.id)} className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded">
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {editRecord && (
        <Modal title="编辑记录" onClose={() => setEditRecord(null)}>
          <WorkRecordForm record={editRecord} date={editRecord.date} projects={projects} onSave={handleSave} onClose={() => setEditRecord(null)} />
        </Modal>
      )}
      {deleteConfirm && (
        <Modal title="确认删除" onClose={() => setDeleteConfirm(null)}>
          <p className="text-gray-600 mb-6">确定要删除这条工作记录吗？</p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
            <button onClick={() => { setWorkRecords(workRecords.filter(r => r.id !== deleteConfirm)); setDeleteConfirm(null); }} className="px-4 py-2 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600">删除</button>
          </div>
        </Modal>
      )}
    </div>
  );
}
