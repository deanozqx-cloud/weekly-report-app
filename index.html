// ─────────────────────────────────────────
// ─────────────────────────────────────────
// 项目明细弹窗
// ─────────────────────────────────────────
function ProjectDetailModal({ project, workRecords, weeklyReports, startDate, endDate, onClose }) {
  const [tab, setTab] = useState('records');

  const records = workRecords
    .filter(r => r.project === project && r.date >= startDate && r.date <= endDate)
    .sort((a, b) => b.date.localeCompare(a.date));

  const reports = weeklyReports
    .filter(r => r.weekStart >= startDate && r.weekEnd <= endDate &&
      (r.items || []).some(it => it.project === project))
    .sort((a, b) => b.weekStart.localeCompare(a.weekStart));

  const totalHours = records.reduce((s, r) => s + r.hours, 0);

  return (
    <Modal title={project} onClose={onClose} width="max-w-2xl">
      {/* Tab 切换 */}
      <div className="flex gap-1 mb-4 bg-gray-100 rounded-lg p-1">
        <button
          onClick={() => setTab('records')}
          className={`flex-1 text-sm py-1.5 rounded-md font-medium transition-colors ${tab === 'records' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
        >
          工作明细（{records.length}条）
        </button>
        <button
          onClick={() => setTab('reports')}
          className={`flex-1 text-sm py-1.5 rounded-md font-medium transition-colors ${tab === 'reports' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
        >
          周报记录（{reports.length}份）
        </button>
      </div>

      {tab === 'records' && (
        <div>
          {totalHours > 0 && (
            <p className="text-xs text-gray-400 mb-3">
              合计 <strong className="text-blue-600">{totalHours.toFixed(1)}h</strong> / <strong className="text-blue-600">{(totalHours/7.5).toFixed(1)}人天</strong>
            </p>
          )}
          <div className="max-h-96 overflow-y-auto scrollbar-thin space-y-2">
            {records.length === 0 ? (
              <p className="text-sm text-gray-400 text-center py-8">暂无明细记录</p>
            ) : records.map(r => (
              <div key={r.id} className="flex items-start justify-between gap-3 px-3 py-2.5 bg-gray-50 rounded-lg text-sm">
                <span className="text-gray-400 shrink-0 w-24">{r.date}</span>
                <span className="flex-1 text-gray-700">{r.content}</span>
                <span className="text-blue-600 font-medium shrink-0">{r.hours}h</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 'reports' && (
        <div className="max-h-96 overflow-y-auto scrollbar-thin space-y-3">
          {reports.length === 0 ? (
            <p className="text-sm text-gray-400 text-center py-8">暂无周报记录</p>
          ) : reports.map(r => {
            const item = (r.items || []).find(it => it.project === project);
            return (
              <div key={r.id} className="border border-gray-100 rounded-lg p-3">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-sm font-medium text-gray-700">{r.weekStart.slice(0,4)}年 {r.range}周</span>
                  <span className="text-xs text-gray-400">{r.weekStart} ～ {r.weekEnd}</span>
                </div>
                {item && (
                  <div className="text-xs text-gray-600 space-y-0.5">
                    <div><span className="text-gray-400">工作内容：</span>{item.content}</div>
                    <div><span className="text-gray-400">项目进度：</span>{item.progress}</div>
                    {item.note && <div><span className="text-gray-400">备注：</span>{item.note}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </Modal>
  );
}

function ProjectSummaryPage({ workRecords, weeklyReports = [], settings, setSettings }) {
  const now = new Date();
  const [startDate, setStartDate] = useState(`${now.getFullYear()}-01-01`);
  const [endDate, setEndDate] = useState(today());
  const [selectedProject, setSelectedProject] = useState(null);
  const [filterProject, setFilterProject] = useState('');
  const [filterStatus, setFilterStatus] = useState('');

  const projectStatuses = settings?.projectStatuses || {};
  const statusOptions = settings?.statusOptions || DEFAULT_STATUS_OPTIONS;

  const setProjectStatus = (project, status) => {
    setSettings({ ...settings, projectStatuses: { ...projectStatuses, [project]: status } });
  };
  const addStatusOption = v => {
    setSettings({ ...settings, statusOptions: [...statusOptions, v] });
  };

  const allStats = useMemo(() => {
    const filtered = workRecords.filter(r => r.date >= startDate && r.date <= endDate);
    const byProject = {};
    filtered.forEach(r => {
      if (!byProject[r.project]) byProject[r.project] = { hours: 0, dates: new Set() };
      byProject[r.project].hours += r.hours;
      byProject[r.project].dates.add(r.date);
    });
    return Object.entries(byProject)
      .map(([project, d]) => ({ project, hours: d.hours, personDays: (d.hours / 7.5).toFixed(1), days: d.dates.size }))
      .sort((a, b) => b.hours - a.hours);
  }, [workRecords, startDate, endDate]);

  const stats = allStats.filter(s =>
    (!filterProject || s.project === filterProject) &&
    (!filterStatus || (projectStatuses[s.project] || '') === filterStatus)
  );
  const allProjects = useMemo(() => allStats.map(s => s.project), [allStats]);

  const totalHours = stats.reduce((s, r) => s + r.hours, 0);
  const maxHours = allStats[0]?.hours || 1;

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
      <div className="p-5 border-b border-gray-100 space-y-3">
        <div className="flex items-center gap-4 flex-wrap">
          <h2 className="font-semibold text-gray-800">项目工时汇总</h2>
          <div className="flex items-center gap-2">
            <input type="date" className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" value={startDate} onChange={e => setStartDate(e.target.value)} />
            <span className="text-gray-400">至</span>
            <input type="date" className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" value={endDate} onChange={e => setEndDate(e.target.value)} />
          </div>
          {totalHours > 0 && <span className="text-sm text-gray-500">总计 <strong className="text-blue-600">{totalHours.toFixed(1)}h</strong> / <strong className="text-blue-600">{(totalHours/7.5).toFixed(1)}人天</strong>，共 <strong className="text-gray-700">{stats.length}</strong> 个项目</span>}
        </div>
        <div className="flex gap-3 flex-wrap">
          <SearchableProjectSelect
            projects={allProjects}
            value={filterProject}
            onChange={setFilterProject}
            placeholder="筛选项目…"
            className="w-52"
          />
          <select
            className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
            value={filterStatus}
            onChange={e => setFilterStatus(e.target.value)}
          >
            <option value="">全部状态</option>
            {statusOptions.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto p-5 scrollbar-thin">
        {stats.length === 0 ? (
          <div className="flex flex-col items-center justify-center h-40 text-gray-300">
            <p className="text-sm">所选时间范围内暂无记录</p>
          </div>
        ) : (
          <div className="space-y-3">
            {stats.map((s, idx) => (
              <div
                key={s.project}
                onClick={() => setSelectedProject(s.project)}
                className="border border-gray-100 rounded-xl p-4 hover:border-blue-200 hover:bg-blue-50 transition-colors cursor-pointer"
              >
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-xs text-gray-400 w-5 shrink-0">#{allStats.indexOf(s)+1}</span>
                    <span className="font-semibold text-gray-800 truncate">{s.project}</span>
                  </div>
                  <div className="flex items-center gap-3 shrink-0 ml-2">
                    <div onClick={e => e.stopPropagation()}>
                      <EditableSelect
                        value={projectStatuses[s.project] || ''}
                        options={statusOptions}
                        onChange={v => setProjectStatus(s.project, v)}
                        onAddOption={addStatusOption}
                        placeholder="设置状态"
                        className="w-24"
                      />
                    </div>
                    <div className="flex gap-3 text-sm">
                      <span className="text-gray-500">工时 <strong className="text-blue-600">{s.hours.toFixed(1)}h</strong></span>
                      <span className="text-gray-500">人天 <strong className="text-gray-700">{s.personDays}天</strong></span>
                    </div>
                  </div>
                </div>
                <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-blue-400 rounded-full transition-all" style={{width:`${(s.hours/maxHours)*100}%`}}></div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {selectedProject && (
        <ProjectDetailModal
          project={selectedProject}
          workRecords={workRecords}
          weeklyReports={weeklyReports}
          startDate={startDate}
          endDate={endDate}
          onClose={() => setSelectedProject(null)}
        />
      )}
    </div>
  );
}

// ─────────────────────────────────────────
// 设置页面
// ─────────────────────────────────────────
function SettingsPage({ settings, setSettings, currentUser, syncStatus, syncMsg, syncTime, onManualSync, onLogout, setWorkRecords, setWeeklyReports }) {
  const providers = settings.llm.providers || DEFAULT_PROVIDERS;
  const [activeId, setActiveId] = useState(providers[0]?.id || '');
  const [testResult, setTestResult] = useState({});   // { [id]: '✓ ...' | '✗ ...' }
  const [testing, setTesting] = useState(false);
  const [showAddModal, setShowAddModal] = useState(false);
  const [saved, setSaved] = useState(false);

  const activeCfg = providers.find(p => p.id === activeId);

  // 更新某个 provider 的某个字段
  const updateProvider = (id, field, val) => {
    setSettings({
      ...settings,
      llm: {
        ...settings.llm,
        providers: providers.map(p => p.id === id ? { ...p, [field]: val } : p),
      },
    });
  };

  // 添加新 provider
  const addProvider = (data) => {
    const newId = uid();
    const newP = { id: newId, label: data.label, apiKey: '', model: data.model || '', baseUrl: data.baseUrl || '', apiType: data.apiType || 'openai' };
    setSettings({ ...settings, llm: { ...settings.llm, providers: [...providers, newP] } });
    setActiveId(newId);
    setShowAddModal(false);
  };

  // 删除 provider
  const deleteProvider = (id) => {
    if (providers.length <= 1) return;
    if (!window.confirm('确定删除该 LLM 配置？')) return;
    const next = providers.filter(p => p.id !== id);
    const newDefault = settings.llm.default === id ? next[0].id : settings.llm.default;
    setSettings({ ...settings, llm: { ...settings.llm, providers: next, default: newDefault } });
    setActiveId(next[0].id);
    setTestResult(r => { const c = {...r}; delete c[id]; return c; });
  };

  // 测试连接
  const handleTest = async (id) => {
    setTesting(true);
    setTestResult(r => ({ ...r, [id]: '' }));
    try {
      const settingsCopy = { ...settings, llm: { ...settings.llm, default: id } };
      const result = await callAI(settingsCopy, '请回复"连接成功"');
      setTestResult(r => ({ ...r, [id]: `✓ 连接成功：${result.slice(0, 40)}` }));
    } catch (e) {
      setTestResult(r => ({ ...r, [id]: `✗ ${e.message}` }));
    } finally {
      setTesting(false);
    }
  };

  const handleSave = () => { setSaved(true); setTimeout(() => setSaved(false), 2000); };

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 max-w-2xl h-full overflow-y-auto scrollbar-thin">
      <div className="p-6 border-b border-gray-100">
        <h2 className="font-semibold text-gray-800 text-lg">设置</h2>
      </div>

      <div className="p-6 space-y-8">

        {/* ── LLM 配置 ── */}
        <div>
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-medium text-gray-700">LLM 配置</h3>
            <button onClick={() => setShowAddModal(true)} className="flex items-center gap-1 text-sm text-blue-600 hover:text-blue-700 border border-blue-200 hover:border-blue-400 px-3 py-1.5 rounded-lg transition-colors">
              <span className="text-base leading-none">+</span> 添加
            </button>
          </div>

          {/* 标签页 */}
          <div className="flex gap-1 flex-wrap border-b border-gray-200 mb-5">
            {providers.map(p => (
              <button
                key={p.id}
                onClick={() => { setActiveId(p.id); }}
                className={`relative px-3 py-2 text-sm font-medium border-b-2 transition-colors flex items-center gap-1.5 ${activeId === p.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
              >
                {p.label}
                {p.id === settings.llm.default && (
                  <span className="w-1.5 h-1.5 rounded-full bg-blue-500 inline-block" title="默认"></span>
                )}
                {p.apiKey && <span className="w-1.5 h-1.5 rounded-full bg-green-400 inline-block" title="已配置"></span>}
              </button>
            ))}
          </div>

          {/* 编辑表单 */}
          {activeCfg && (
            <div className="space-y-4 fade-in">
              {/* 名称 + API类型 */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">显示名称</label>
                  <input
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                    value={activeCfg.label}
                    onChange={e => updateProvider(activeId, 'label', e.target.value)}
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">接口类型</label>
                  <select
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                    value={activeCfg.apiType || 'openai'}
                    onChange={e => updateProvider(activeId, 'apiType', e.target.value)}
                  >
                    <option value="openai">OpenAI 兼容</option>
                    <option value="claude">Claude (Anthropic)</option>
                  </select>
                </div>
              </div>

              {/* API Key */}
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">API Key</label>
                <input
                  type="password"
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                  placeholder="sk-..."
                  value={activeCfg.apiKey || ''}
                  onChange={e => updateProvider(activeId, 'apiKey', e.target.value)}
                />
              </div>

              {/* 模型 + API地址 */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">模型名称</label>
                  <input
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                    placeholder="model-name"
                    value={activeCfg.model || ''}
                    onChange={e => updateProvider(activeId, 'model', e.target.value)}
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">API 地址</label>
                  <input
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                    placeholder="https://api.example.com/v1"
                    value={activeCfg.baseUrl || ''}
                    onChange={e => updateProvider(activeId, 'baseUrl', e.target.value)}
                  />
                </div>
              </div>

              {/* 操作栏 */}
              <div className="flex items-center gap-2 flex-wrap pt-1">
                <button
                  onClick={() => handleTest(activeId)}
                  disabled={testing || !activeCfg.apiKey}
                  className="px-3 py-1.5 text-sm border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 disabled:opacity-40"
                >
                  {testing ? '测试中...' : '测试连接'}
                </button>
                {settings.llm.default !== activeId ? (
                  <button
                    onClick={() => setSettings({ ...settings, llm: { ...settings.llm, default: activeId } })}
                    className="px-3 py-1.5 text-sm border border-blue-200 text-blue-600 rounded-lg hover:bg-blue-50"
                  >
                    设为默认
                  </button>
                ) : (
                  <span className="px-3 py-1.5 text-sm bg-blue-50 text-blue-600 rounded-lg border border-blue-200">当前默认 ✓</span>
                )}
                {providers.length > 1 && (
                  <button
                    onClick={() => deleteProvider(activeId)}
                    className="ml-auto px-3 py-1.5 text-sm text-red-400 hover:text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 rounded-lg"
                  >
                    删除
                  </button>
                )}
              </div>

              {testResult[activeId] && (
                <div className={`text-sm px-3 py-2 rounded-lg ${testResult[activeId].startsWith('✓') ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}`}>
                  {testResult[activeId]}
                </div>
              )}
            </div>
          )}
        </div>

        {/* ── 账号与数据同步 ── */}
        <SbUserSection
          currentUser={currentUser}
          syncStatus={syncStatus} syncMsg={syncMsg} syncTime={syncTime}
          onManualSync={onManualSync} onLogout={onLogout}
        />

        {/* ── 设置云同步提示 ── */}
        <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-xs text-amber-700 space-y-1">
          <p className="font-medium">启用设置云同步（防止 API Key 丢失）</p>
          <p>在 Supabase 控制台 → SQL Editor 中执行以下命令，即可将 API Key 等设置同步到云端：</p>
          <code className="block bg-amber-100 rounded px-2 py-1 font-mono select-all">ALTER TABLE user_data ADD COLUMN IF NOT EXISTS settings JSONB;</code>
        </div>

        {/* ── 默认工时 ── */}
        <div>
          <h3 className="font-medium text-gray-700 mb-3">默认工时设置</h3>
          <div className="flex items-center gap-3">
            <label className="text-sm text-gray-600">每天标准工时（小时）</label>
            <input
              type="number" min="1" max="24" step="0.5"
              className="border border-gray-200 rounded-lg px-3 py-2 text-sm w-24 focus:outline-none focus:ring-2 focus:ring-blue-300"
              value={settings.defaultHours}
              onChange={e => setSettings({ ...settings, defaultHours: parseFloat(e.target.value) })}
            />
          </div>
        </div>

        {/* ── 自动提醒 ── */}
        <div>
          <h3 className="font-medium text-gray-700 mb-3">自动生成提醒</h3>
          <div className="space-y-3">
            <label className="flex items-center gap-3 cursor-pointer">

            >清空周报</button>
            <button
              onClick={() => { if (window.confirm('确定清空全部数据（工作记录 + 周报）？此操作不可恢复。')) { setWorkRecords([]); setWeeklyReports([]); } }}

            >清空全部数据</button>
          </div>
        </div>
      </div>

      {/* 添加 LLM 弹窗 */}
      {showAddModal && <AddProviderModal onAdd={addProvider} onClose={() => setShowAddModal(false)} />}
    </div>
  );
}

function AuthPage({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [displayName, setDisplayName] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async () => {
    if (!email.trim() || !password) { setError('请填写邮箱和密码'); return; }
    setLoading(true);
    setError('');
    try {
      if (mode === 'login') {
        const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
        onLogin(data.user);
      } else {
        if (!displayName.trim()) { setError('请填写姓名'); setLoading(false); return; }
        const { data, error } = await sb.auth.signUp({
          email: email.trim(),
          password,
          options: { data: { display_name: displayName.trim() } },
        });
        if (error) throw error;
        if (data.user && !data.session) {
          setError('注册成功！请前往邮箱点击确认链接后再登录。');
          setLoading(false);
          return;
        }
        onLogin(data.user);
      }
    } catch (e) {
      const errorMap = {
        'Invalid login credentials': '邮箱或密码错误',
        'User already registered': '该邮箱已被注册',
        'Email not confirmed': '邮箱尚未确认，请查收确认邮件',
      };
      setError(errorMap[e.message] || e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
      <div className="bg-white rounded-2xl shadow-lg w-full max-w-sm mx-4 p-8">
        <div className="text-center mb-8">
          <div className="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-white font-bold text-xl mx-auto mb-3">周</div>
          <h1 className="text-xl font-semibold text-gray-800">周报助手</h1>
          <p className="text-sm text-gray-400 mt-1">{mode === 'login' ? '登录账号继续使用' : '注册新账号'}</p>
        </div>

        <div className="space-y-4">
          {mode === 'register' && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">姓名</label>
              <input
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                placeholder="您的姓名"
                value={displayName}
                onChange={e => setDisplayName(e.target.value)}
              />
            </div>
          )}
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
            <input
              type="email"
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              placeholder="name@company.com"
              value={email}
              onChange={e => setEmail(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSubmit()}
            />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input
              type="password"
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              placeholder="••••••••"
              value={password}
              onChange={e => setPassword(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSubmit()}
            />
          </div>
          {error && <p className="text-sm text-red-500 bg-red-50 px-3 py-2 rounded-lg">{error}</p>}
          <button
            onClick={handleSubmit}
            disabled={loading}
            className="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium text-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {loading ? (mode === 'login' ? '登录中…' : '注册中…') : (mode === 'login' ? '登录' : '注册')}
          </button>
        </div>

        <div className="text-center mt-5">
          <button
            onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setError(''); }}
            className="text-sm text-blue-600 hover:text-blue-700"
          >
            {mode === 'login' ? '没有账号？立即注册' : '已有账号？去登录'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
function App() {
  const [activePage, setActivePage] = useState('workbench');
  const [currentUser, setCurrentUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  const [workRecords, setWorkRecordsRaw] = useStorage('workRecords', []);
  const [weeklyReports, setWeeklyReportsRaw] = useStorage('weeklyReports', []);
  const [settings, setSettingsRaw] = useStorage('settings', defaultSettings);

  // 同步状态：idle | loading | syncing | synced | error
  const [syncStatus, setSyncStatus] = useState('idle');
  const [syncMsg, setSyncMsg] = useState('');
  const [syncTime, setSyncTime] = useState(null);
  const autoSaveTimer = useRef(null);
  const isMounted = useRef(true);

  useEffect(() => { isMounted.current = true; return () => { isMounted.current = false; }; }, []);

  // 合并设置（兼容旧格式，深合并 providers 确保 apiKey 不被代码更新覆盖）
  const mergedSettings = useMemo(() => {
    const s = { ...defaultSettings, ...settings };
    if (!settings.llm) {
      s.llm = defaultSettings.llm;
    } else if (!settings.llm.providers) {
      // 旧格式迁移：settings.llm[providerId] = { apiKey, model, ... }
      const migratedProviders = DEFAULT_PROVIDERS.map(p => ({ ...p, ...(settings.llm[p.id] || {}) }));
      s.llm = { default: settings.llm.default || 'deepseek', providers: migratedProviders };
    } else {
      // 逐 provider 合并：DEFAULT_PROVIDERS 提供默认结构，用户存储的字段（尤其是 apiKey）优先
      const storedById = {};
      settings.llm.providers.forEach(p => { storedById[p.id] = p; });
      const mergedProviders = DEFAULT_PROVIDERS.map(p => ({ ...p, ...(storedById[p.id] || {}) }));
      // 保留用户自行添加的自定义 provider（id 不在 DEFAULT_PROVIDERS 中）
      settings.llm.providers.forEach(p => {
        if (!DEFAULT_PROVIDERS.find(d => d.id === p.id)) mergedProviders.push(p);
      });
      s.llm = { ...defaultSettings.llm, ...settings.llm, providers: mergedProviders };
    }
    return s;
  }, [settings]);

  const setWorkRecords = (v) => setWorkRecordsRaw(typeof v === 'function' ? v(workRecords) : v);
  const setWeeklyReports = (v) => setWeeklyReportsRaw(typeof v === 'function' ? v(weeklyReports) : v);
  const setSettings = (v) => setSettingsRaw(typeof v === 'function' ? v(settings) : v);

  // ── 从 Supabase 加载数据 ──
  const loadData = useCallback(async () => {
    setSyncStatus('loading');
    try {
      const data = await sbLoad();
      if (data) {
        if (data.workRecords)   setWorkRecordsRaw(data.workRecords);
        if (data.weeklyReports) setWeeklyReportsRaw(data.weeklyReports);
        // 若 Supabase 有保存过 settings，以 Supabase 为准（本地 settings 与其合并，优先保留 Supabase 的 apiKey）
        if (data.settings) setSettingsRaw(prev => {
          const remote = data.settings;
          const remoteById = {};
          (remote.llm?.providers || []).forEach(p => { remoteById[p.id] = p; });
          const localById = {};
          (prev.llm?.providers || []).forEach(p => { localById[p.id] = p; });
          // apiKey 取非空值优先：本地已有 apiKey 则不被远端空值覆盖
          const mergedProviders = DEFAULT_PROVIDERS.map(p => {
            const local = localById[p.id] || {};
            const remote = remoteById[p.id] || {};
            return { ...p, ...local, ...remote, apiKey: remote.apiKey || local.apiKey || p.apiKey };
          });
          return { ...prev, ...remote, llm: { ...prev.llm, ...remote.llm, providers: mergedProviders } };
        });
      }
      if (isMounted.current) { setSyncStatus('synced'); setSyncTime(new Date()); setSyncMsg(''); }
    } catch (e) {
      if (isMounted.current) { setSyncStatus('error'); setSyncMsg(e.message); }
    }
  }, []);

  // ── 保存到 Supabase ──
  const saveData = useCallback(async (wr, wpr) => {
    setSyncStatus('syncing');
    try {
      await sbSave(wr, wpr, settings);
      if (isMounted.current) { setSyncStatus('synced'); setSyncTime(new Date()); setSyncMsg(''); }
    } catch (e) {
      if (isMounted.current) { setSyncStatus('error'); setSyncMsg(e.message); }
    }
  }, [settings]);

  // 统一用 onAuthStateChange 处理登录态：
  // - INITIAL_SESSION：页面加载时自动从 localStorage 恢复 session（持久登录的关键）
  // - SIGNED_IN：新登录，handleLogin 已处理，这里只更新 user 对象
  // - TOKEN_REFRESHED：access token 自动刷新，同步最新 user 避免意外登出
  // - SIGNED_OUT：清理状态
  useEffect(() => {
    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'INITIAL_SESSION') {
        if (session?.user) {
          setCurrentUser(session.user);
          loadData();
        }
        setAuthLoading(false);
      } else if (event === 'TOKEN_REFRESHED' && session?.user) {
        setCurrentUser(session.user);
      } else if (event === 'SIGNED_OUT') {
        setCurrentUser(null);
        setWorkRecordsRaw([]);
        setWeeklyReportsRaw([]);
        setSyncStatus('idle');
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // 数据变化时自动保存（防抖 3s）
  useEffect(() => {
    if (!currentUser || syncStatus === 'loading') return;
    clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current = setTimeout(() => {
      saveData(workRecords, weeklyReports);
    }, 3000);
    return () => clearTimeout(autoSaveTimer.current);
  }, [workRecords, weeklyReports]);

  const handleLogin = (user) => {
    setCurrentUser(user);
    loadData();
  };

  const handleLogout = async () => {
    if (!window.confirm('确定退出登录？')) return;
    await sb.auth.signOut();
    // onAuthStateChange 会处理状态清理
  };

  const isMobile = useIsMobile();

  if (authLoading) {
    return (
      <div className="min-h-screen bg-gray-50 flex items-center justify-center">
        <div className="text-gray-400 text-sm">加载中…</div>
      </div>
    );
  }

  if (!currentUser) return <AuthPage onLogin={handleLogin} />;

  const pageTitle = { workbench: '工作台', report: '周报管理', detail: '工作明细', summary: '项目汇总', settings: '设置' };

  const SyncIndicator = () => {
    const label = { loading: '加载中…', syncing: '同步中…', synced: '已同步', error: '同步失败', idle: '' }[syncStatus] || '';
    const color = { loading: 'text-blue-400', syncing: 'text-blue-400', synced: 'text-green-500', error: 'text-red-400', idle: 'text-gray-300' }[syncStatus];
    const icon = { loading: '↻', syncing: '↻', synced: '✓', error: '✗', idle: '○' }[syncStatus];
    const spin = syncStatus === 'loading' || syncStatus === 'syncing';
    return (
      <div
        className={`flex items-center gap-1.5 text-xs ${color} cursor-pointer`}
        title={syncStatus === 'error' ? syncMsg : syncTime ? `上次同步：${syncTime.toLocaleTimeString()}` : ''}
        onClick={() => saveData(workRecords, weeklyReports)}
      >
        <span className={spin ? 'animate-spin inline-block' : ''}>{icon}</span>
        {!isMobile && <span>{label}</span>}
      </div>
    );
  };

  return (
    <div className="flex h-screen overflow-hidden">
      {!isMobile && <Sidebar activePage={activePage} setActivePage={setActivePage} currentUser={currentUser} />}

      <div className="flex-1 flex flex-col overflow-hidden bg-gray-50">
        {/* 顶部 */}
        <div className="h-14 flex items-center px-4 md:px-6 bg-white border-b border-gray-100 shadow-sm gap-4">
          {isMobile && (
            <div className="w-7 h-7 rounded-lg flex items-center justify-center text-white font-bold text-xs shrink-0" style={{background:'linear-gradient(135deg,#3b82f6,#6366f1)'}}>周</div>
          )}
          <h1 className="text-base font-semibold text-gray-800">{pageTitle[activePage]}</h1>
          <div className="ml-auto flex items-center gap-3">
            <SyncIndicator />
            <span className="text-xs text-gray-400">{today()}</span>
          </div>
        </div>

        {/* 内容区 */}
        <div className={`flex-1 overflow-hidden p-4 md:p-5 ${isMobile ? 'pb-20' : ''}`}>
          <div className="h-full page-transition" key={activePage}>
            {activePage === 'workbench' && (
              <WorkbenchPage workRecords={workRecords} setWorkRecords={setWorkRecords} settings={mergedSettings} />
            )}
            {activePage === 'report' && (
              <WeeklyReportPage workRecords={workRecords} setWorkRecords={setWorkRecords} weeklyReports={weeklyReports} setWeeklyReports={setWeeklyReports} settings={mergedSettings} setSettings={setSettings} />
            )}
            {activePage === 'detail' && (
              <WorkDetailPage workRecords={workRecords} setWorkRecords={setWorkRecords} />
            )}
            {activePage === 'summary' && (
              <ProjectSummaryPage workRecords={workRecords} weeklyReports={weeklyReports} settings={mergedSettings} setSettings={setSettings} />
            )}
            {activePage === 'settings' && (
              <SettingsPage
                settings={mergedSettings} setSettings={setSettings}
                currentUser={currentUser}
                syncStatus={syncStatus} syncMsg={syncMsg} syncTime={syncTime}
                onManualSync={() => saveData(workRecords, weeklyReports)}
                onLogout={handleLogout}
                setWorkRecords={setWorkRecords}
                setWeeklyReports={setWeeklyReports}
              />
            )}
          </div>
        </div>
      </div>

      {isMobile && <MobileNav activePage={activePage} setActivePage={setActivePage} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
